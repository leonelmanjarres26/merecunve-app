<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merecunve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── HEADER ── */
    header {
      background: #c0392b;
      color: #fff;
      padding: 18px 20px 14px;
    }
    header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
    header p  { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }

    /* ── DATOS CLIENTE ── */
    #datos-cliente {
      padding: 14px 16px 10px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #eee;
      background: #fff;
    }
    .campo {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .campo label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .campo input {
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
      width: 100%;
    }
    .campo input:focus { border-color: #c0392b; }
    .campo input.error { border-color: #e74c3c; background: #fff5f5; }

    /* ── CATEGORÍAS ── */
    #categorias {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    #categorias::-webkit-scrollbar { display: none; }

    .cat-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #c0392b;
      background: transparent;
      color: #c0392b;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.activo { background: #c0392b; color: #fff; }

    /* ── MENÚ ── */
    #menu {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      overflow-y: auto;
      padding-bottom: 110px;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .item-emoji { font-size: 2.3rem; min-width: 50px; text-align: center; }

    .item-info { flex: 1; }
    .item-info h3 { font-size: 0.93rem; font-weight: 700; color: #222; }
    .item-info p  { font-size: 0.77rem; color: #888; margin-top: 2px; }
    .item-price   { font-size: 0.92rem; font-weight: 700; color: #c0392b; margin-top: 3px; }

    .btn-agregar {
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 34px;
      height: 34px;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .btn-agregar:active { transform: scale(0.9); }

    /* ── CARRITO FLOTANTE ── */
    #carrito-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 398px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #carrito-btn .badge {
      background: #c0392b;
      color: #fff;
      border-radius: 8px;
      padding: 2px 10px;
      font-size: 0.85rem;
    }
    #carrito-btn.oculto { display: none; }

    /* ── PANEL CARRITO ── */
    #panel-carrito {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    #panel-carrito.oculto { display: none; }

    #carrito-sheet {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px;
      border-bottom: 1px solid #eee;
    }
    .sheet-header h2 { font-size: 1.1rem; font-weight: 700; }

    .btn-cerrar {
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1rem;
      cursor: pointer;
    }

    #lista-carrito {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .carrito-item { display: flex; flex-direction: column; gap: 7px; }

    .ci-fila {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ci-emoji  { font-size: 1.5rem; min-width: 34px; text-align: center; }
    .ci-info   { flex: 1; }
    .ci-info h4 { font-size: 0.88rem; font-weight: 600; }
    .ci-info span { font-size: 0.78rem; color: #888; }

    .ci-controles {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .ci-controles button {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #f9f9f9;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .ci-controles .qty { font-weight: 700; min-width: 18px; text-align: center; font-size: 0.9rem; }

    .ci-notas {
      width: 100%;
      border: 1.5px solid #eee;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: #555;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: 0.2s;
    }
    .ci-notas:focus { border-color: #c0392b; }
    .ci-notas::placeholder { color: #bbb; }

    .sheet-footer {
      padding: 14px 20px 28px;
      border-top: 1px solid #eee;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-pedir {
      width: 100%;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-pedir:disabled { background: #ccc; cursor: not-allowed; }

    /* ── CONFIRMACIÓN ── */
    #pantalla-confirmacion {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
    }
    #pantalla-confirmacion.oculto { display: none; }
    #pantalla-confirmacion .check { font-size: 5rem; }
    #pantalla-confirmacion h2 { font-size: 1.5rem; font-weight: 800; }
    #pantalla-confirmacion p  { font-size: 0.95rem; color: #666; line-height: 1.5; }
    #pantalla-confirmacion .num-pedido {
      background: #fff0ef;
      color: #c0392b;
      font-size: 1.4rem;
      font-weight: 800;
      padding: 10px 28px;
      border-radius: 12px;
    }
    .btn-nuevo {
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>MERECUNVE</h1>
    <p>Haz tu pedido fácil y rápido</p>
  </header>

  <div id="datos-cliente">
    <div class="campo">
      <label>Tu nombre</label>
      <input id="inp-nombre" type="text" placeholder="Ej: Juan Pérez" maxlength="60" />
    </div>
    <div class="campo" style="max-width:110px">
      <label>Mesa</label>
      <input id="inp-mesa" type="text" placeholder="Ej: 5" maxlength="10" />
    </div>
  </div>

  <div id="categorias"></div>
  <div id="menu"></div>

  <button id="carrito-btn" class="oculto" onclick="abrirCarrito()">
    <span>🛒 Ver pedido</span>
    <span class="badge" id="carrito-badge">0</span>
  </button>

  <div id="panel-carrito" class="oculto" onclick="cerrarSiFondo(event)">
    <div id="carrito-sheet">
      <div class="sheet-header">
        <h2>Tu pedido</h2>
        <button class="btn-cerrar" onclick="cerrarCarrito()">✕</button>
      </div>
      <div id="lista-carrito"></div>
      <div class="sheet-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="total-precio">$0</span>
        </div>
        <button class="btn-pedir" id="btn-confirmar" onclick="confirmarPedido()">Confirmar pedido</button>
      </div>
    </div>
  </div>

  <div id="pantalla-confirmacion" class="oculto">
    <div class="check">✅</div>
    <h2>¡Pedido recibido!</h2>
    <p id="conf-detalle">Tu pedido está siendo preparado.</p>
    <div class="num-pedido" id="num-pedido">P000000</div>
    <button class="btn-nuevo" onclick="nuevoPedido()">Hacer otro pedido</button>
  </div>
</div>

<div id="toast"></div>

<script>
  // Diagnostics: show JS errors in-page for easier debugging
  (function(){
    const dbg = document.createElement('div');
    dbg.id = 'js-debug';
    dbg.style.position = 'fixed'; dbg.style.right = '12px'; dbg.style.top = '12px'; dbg.style.background = 'rgba(0,0,0,0.8)'; dbg.style.color='#fff'; dbg.style.padding='8px 10px'; dbg.style.borderRadius='8px'; dbg.style.zIndex=9999; dbg.style.maxWidth='320px'; dbg.style.fontSize='13px'; dbg.style.display='none';
    document.body.appendChild(dbg);
    window.showDebug = function(msg){ dbg.textContent = msg; dbg.style.display = 'block'; };
    window.hideDebug = function(){ dbg.style.display = 'none'; };
    window.onerror = function(msg, src, line, col, err){
      const text = `${msg} at ${src}:${line}:${col}`;
      console.error(text, err);
      showDebug(text);
    };
    window.addEventListener('unhandledrejection', e=>{ console.error('UnhandledRejection', e.reason); showDebug('Promise rejection: '+(e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason))); });
  })();

  let MENU_DATA = [];    
  let carrito = {};          // { id: { item, cantidad, notas } }
  let categoriaActiva = '';

  // ── Carga inicial ──────────────────────────────────────
  async function init() {
    try {
      const res  = await fetch('/api/menu');
      if (!res.ok) throw new Error('No response');
      MENU_DATA  = await res.json();
      const cats = [...new Set(MENU_DATA.map(i => i.categoria))];
      categoriaActiva = cats[0] || '';
      renderCategorias();
      renderMenu();
    } catch (err) {
      console.error('No se pudo cargar el menú desde /api/menu', err);
      showDebug('No se pudo conectar al servidor. Abre la app por http://localhost:3000 o inicia el servidor con node server.js');
      // mostrar advertencia en la UI para usuarios que abren el archivo localmente
      if (!document.getElementById('server-warning')) {
        const warn = document.createElement('div');
        warn.id = 'server-warning';
        warn.style.background = '#fff4f0';
        warn.style.border = '1px solid #ffd2c2';
        warn.style.color = '#80311b';
        warn.style.padding = '12px';
        warn.style.margin = '12px';
        warn.style.borderRadius = '10px';
        warn.innerHTML = `No se detecta el servidor en <strong>http://localhost:3000</strong>.\n Asegúrate de ejecutar <code>node server.js</code> y luego pulsa <a href="/" target="_blank">Abrir app</a>.`;
        const app = document.getElementById('app');
        app.insertBefore(warn, app.firstChild);
      }
    }
  }

  // ── Categorías ─────────────────────────────────────────
  function renderCategorias() {
    const cats = [...new Set(MENU_DATA.map(i => i.categoria))];
    document.getElementById('categorias').innerHTML = cats.map(c =>
      `<button class="cat-btn ${c === categoriaActiva ? 'activo' : ''}" onclick="selCat('${c}')">${c}</button>`
    ).join('');
  }

  function selCat(cat) {
    categoriaActiva = cat;
    renderCategorias();
    renderMenu();
  }

  // ── Menú ───────────────────────────────────────────────
  function renderMenu() {
    const items = MENU_DATA.filter(i => i.categoria === categoriaActiva);
    document.getElementById('menu').innerHTML = items.map(i => `
      <div class="item-card">
        <div class="item-emoji">${i.emoji}</div>
        <div class="item-info">
          <h3>${i.nombre}</h3>
          <p>${i.descripcion}</p>
          <div class="item-price">${fmt(i.precio)}</div>
        </div>
        <button class="btn-agregar" onclick="agregarItem(${i.id})">+</button>
      </div>
    `).join('');
  }

  // ── Carrito ────────────────────────────────────────────
  function agregarItem(id) {
    const item = MENU_DATA.find(i => i.id === id);
    if (!carrito[id]) carrito[id] = { item, cantidad: 0, notas: '' };
    carrito[id].cantidad++;
    actualizarBadge();
    showToast(`${item.emoji} ${item.nombre} agregado`);
  }

  function cambiarCantidad(id, delta) {
    if (!carrito[id]) return;
    carrito[id].cantidad += delta;
    if (carrito[id].cantidad <= 0) delete carrito[id];
    actualizarBadge();
    renderCarrito();
  }

  function actualizarNota(id, valor) {
    if (carrito[id]) carrito[id].notas = valor;
  }

  function actualizarBadge() {
    const total = Object.values(carrito).reduce((a, b) => a + b.cantidad, 0);
    document.getElementById('carrito-badge').textContent = total;
    document.getElementById('carrito-btn').classList.toggle('oculto', total === 0);
  }

  function renderCarrito() {
    const entradas = Object.entries(carrito);
    if (entradas.length === 0) { cerrarCarrito(); return; }

    let totalPrecio = 0;
    let html = '';

    entradas.forEach(([id, entry]) => {
      totalPrecio += entry.item.precio * entry.cantidad;
      html += `
        <div class="carrito-item">
          <div class="ci-fila">
            <div class="ci-emoji">${entry.item.emoji}</div>
            <div class="ci-info">
              <h4>${entry.item.nombre}</h4>
              <span>${fmt(entry.item.precio)}</span>
            </div>
            <div class="ci-controles">
              <button onclick="cambiarCantidad(${id}, -1)">−</button>
              <span class="qty">${entry.cantidad}</span>
              <button onclick="cambiarCantidad(${id}, +1)">+</button>
            </div>
          </div>
          <textarea class="ci-notas" rows="1"
            placeholder="Notas (sin sal, sin cebolla...)"
            oninput="actualizarNota(${id}, this.value)"
          >${entry.notas}</textarea>
        </div>`;
    });

    document.getElementById('lista-carrito').innerHTML = html;
    document.getElementById('total-precio').textContent = fmt(totalPrecio);
  }

  function abrirCarrito() {
    renderCarrito();
    document.getElementById('panel-carrito').classList.remove('oculto');
  }

  function cerrarCarrito() {
    document.getElementById('panel-carrito').classList.add('oculto');
  }

  function cerrarSiFondo(e) {
    if (e.target.id === 'panel-carrito') cerrarCarrito();
  }

  // ── Confirmar ──────────────────────────────────────────
  async function confirmarPedido() {
    const nombre = document.getElementById('inp-nombre').value.trim();
    const mesa   = document.getElementById('inp-mesa').value.trim();
    let ok = true;

    document.getElementById('inp-nombre').classList.toggle('error', !nombre);
    document.getElementById('inp-mesa').classList.toggle('error', !mesa);

    if (!nombre || !mesa) {
      cerrarCarrito();
      showToast('Ingresa tu nombre y número de mesa');
      return;
    }

    const btn = document.getElementById('btn-confirmar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const items = Object.values(carrito).map(e => ({
      id:       e.item.id,
      nombre:   e.item.nombre,
      precio:   e.item.precio,
      cantidad: e.cantidad,
      notas:    e.notas,
    }));

    try {
      const res = await fetch('/api/pedidos', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ nombre_cliente: nombre, mesa, items }),
      });

      if (!res.ok) throw new Error();

      const data = await res.json();
      cerrarCarrito();
      document.getElementById('num-pedido').textContent = data.numero_pedido;
      document.getElementById('conf-detalle').textContent =
        `${nombre}, tu pedido para la mesa ${mesa} está siendo preparado.`;
      document.getElementById('pantalla-confirmacion').classList.remove('oculto');
    } catch {
      showToast('Error al enviar el pedido, intenta de nuevo');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Confirmar pedido';
    }
  }

  function nuevoPedido() {
    carrito = {};
    actualizarBadge();
    document.getElementById('pantalla-confirmacion').classList.add('oculto');
  }

  // ── Utilidades ─────────────────────────────────────────
  function fmt(n) {
    return '$' + n.toLocaleString('es-CO');
  }

  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  init();
</script>
</body>
</html>
