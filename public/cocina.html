<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merecunve — Cocina</title>
  <style>
    .hidden{display:none !important}
    body{font-family:Segoe UI, sans-serif;background:#f7f7f7;color:#222}
    header{background:#1a1a2e;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
    header a{color:#fff;text-decoration:none;margin-left:10px}
    main{max-width:960px;margin:18px auto;padding:12px}
    .pedido-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
    .pedido-top{display:flex;justify-content:space-between;align-items:center}
    .estado-badge{padding:6px 12px;border-radius:18px;font-weight:700;text-transform:capitalize}
    .estado-pendiente{background:#fff3cd;color:#856404}
    .estado-en-preparación{background:#cfe2ff;color:#0a58ca}
    .estado-listo{background:#d1e7dd;color:#0f5132}
    .pi-row{display:flex;gap:8px;align-items:center}
    .pi-row .qty{min-width:26px;color:#888}
    .acciones{display:flex;gap:8px}
    .btn{padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
    .btn-primary{background:#0a58ca;color:#fff;border:none}
    .btn-success{background:#0f5132;color:#fff;border:none}
  </style>
</head>
<body>
  <header>
    <div>👩‍🍳 MERECUNVE · Cocina</div>
    <div style="display:flex;gap:10px;align-items:center">
      <div>
        <a href="/">Menú</a>
        <a href="/admin.html">Admin</a>
        <a href="/recepcion.html">Recepción</a>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="token-info" style="color:#fff;opacity:0.9"></span>
        <button class="btn" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main>
    <p style="color:#666;margin-bottom:10px">Mostrando pedidos pendientes y en preparación. Actualización automática.</p>
    <div id="lista-pedidos"></div>
  </main>

  <!-- Login modal (shared) -->
  <div id="login-modal" class="hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4)">
    <div style="background:#fff;padding:18px;border-radius:10px;min-width:280px">
      <h3 style="margin-bottom:8px">Login staff</h3>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="login-user" placeholder="Usuario" />
        <input id="login-pass" type="password" placeholder="Contraseña" />
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
          <button class="btn" onclick="document.getElementById('login-modal').classList.add('hidden')">Cancelar</button>
          <button class="btn" onclick="loginSubmit()">Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fmt(n){return '$' + n.toLocaleString('es-CO')}

    async function cargarPedidos(){
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      const visibles = pedidos.filter(p => p.estado === 'pendiente' || p.estado === 'en preparación');
      const cont = document.getElementById('lista-pedidos');
      if(!visibles.length){cont.innerHTML = '<div style="padding:40px;text-align:center;color:#bbb">No hay pedidos para la cocina</div>';return}

      cont.innerHTML = visibles.map(p => `
        <div class="pedido-card" id="card-${p.id}">
          <div class="pedido-top">
            <div>
              <div style="font-weight:800">${p.numero_pedido} · Mesa ${p.mesa}</div>
              <div style="color:#888;font-size:0.9rem">👤 ${p.nombre_cliente} · ${new Date(p.creado_en).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <div class="estado-badge estado-${p.estado.replace(' ','-')}">${p.estado}</div>
          </div>
          <div style="margin-top:10px">
                  ${p.items.map(i=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
                      <div style="min-width:28px;color:#888">${i.cantidad}×</div>
                      <div style="flex:1">${i.nombre}</div>
                      <div style="font-weight:700">${fmt(i.precio*i.cantidad)}</div>
                      <div><input type="checkbox" ${i.preparado? 'checked' : ''} onchange="marcarItem(${i.id}, this.checked)"> Preparado</div>
                    </div>
                    ${i.notas?`<div style="font-size:0.82rem;color:#aaa;margin-left:34px">📝 ${i.notas}</div>`:''}`).join('')}
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
            <a class="btn" href="/print/pedido/${p.id}" target="_blank">Imprimir</a>
            ${p.estado==='pendiente'?`<button class="btn btn-primary" onclick="marcar(${p.id},'en preparación')">Tomar pedido</button>`:''}
            ${p.estado!=='listo'?`<button class="btn btn-success" onclick="marcar(${p.id},'listo')">Marcar listo</button>`:''}
          </div>
        </div>
      `).join('');
    }

    async function marcar(id, estado){
      await fetch(`/api/pedidos/${id}/estado`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado})});
      cargarPedidos();
    }

    // Auth helpers for cocina
    function authToken(){ return localStorage.getItem('token'); }
    function authFetch(url, opts={}){ opts.headers = opts.headers || {}; const t = authToken(); if(t) opts.headers.Authorization = 'Bearer ' + t; return fetch(url, opts); }

    async function marcarItem(id, preparado){
      const t = authToken();
      if(!t){ showLoginModal(); return; }
      await authFetch(`/api/pedido_items/${id}/preparado`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({preparado})});
      cargarPedidos();
    }

    // Login modal for cocina
    function showLoginModal(){ document.getElementById('login-modal').classList.remove('hidden'); }
    async function loginSubmit(){
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      try{
        const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass})});
        if (!r.ok) return alert('Credenciales inválidas');
        const d = await r.json();
        localStorage.setItem('token', d.token);
        document.getElementById('login-modal').classList.add('hidden');
        alert('Login exitoso');
      } catch(e){ alert('Error'); }
    }

    // JWT helpers: parse and show expiry
    function parseJwt(token){ try{ const p = token.split('.')[1]; return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){return null} }
    function fmtRemaining(s){ if(s<=0) return 'expirado'; const m = Math.floor(s/60); const sec = s%60; return `${m}m ${sec}s`; }
    function updateAuthUI(){ const t = authToken(); const el = document.getElementById('token-info'); if(!el) return; if(!t){ el.textContent = ''; return; } const p = parseJwt(t); if(!p || !p.exp){ el.textContent='Autenticado'; return; } const rem = Math.max(0, Math.floor(p.exp - Date.now()/1000)); el.textContent = 'Sesión: ' + fmtRemaining(rem); if(rem<=0){ localStorage.removeItem('token'); alert('La sesión ha expirado'); el.textContent=''; }}
    setInterval(updateAuthUI, 5000);
    updateAuthUI();

    // Notificación sonora en la cocina
    function beep(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = 800; o.connect(ctx.destination); o.start();
        setTimeout(()=>{ o.stop(); ctx.close(); }, 180);
      }catch(e){}
    }

    // SSE: actualizaciones en tiempo real
    try {
      const es = new EventSource('/api/events');
      es.onmessage = function(e){
        try{ const d = JSON.parse(e.data); if(d.tipo){ cargarPedidos(); if(d.tipo==='nuevo_pedido') { beep(); document.title='(Nuevo) Cocina'; setTimeout(()=>document.title='Merecunve · Cocina',3000);} } }
        catch(err){}
      };
    } catch(err){}

    cargarPedidos();
    setInterval(cargarPedidos,4000);

    // SSE: actualizaciones en tiempo real
    try {
      const es = new EventSource('/api/events');
      es.onmessage = function(e){
        try{ const d = JSON.parse(e.data); if(d.tipo){ cargarPedidos(); } }
        catch(err){}
      };
    } catch(err){}
  </script>
</body>
</html>
