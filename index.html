<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merecunve — Lanzador</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      max-width: 500px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; color: #1f2937; margin-top: 0; }
    p { color: #4b5563; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .btn {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #374151;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .status-bar {
      background-color: #ecfdf5;
      color: #065f46;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🍽️ Merecunve — Lanzador</h1>
  <p>Elige la vista que quieres abrir. Funciona en escritorio, tablet y móviles.</p>
  
  <div class="grid">
    <a href="/app" class="btn">🛒<br>Cliente (Menú)</a>
    <a href="/admin.html" class="btn">📊<br>Admin</a>
    <a href="/recepcion.html" class="btn">📟<br>Recepción</a>
    <a href="/cocina.html" class="btn">👨‍🍳<br>Cocina</a>
  </div>

  <div class="status-bar">
    ✓ Servidor conectado: Listo para trabajar
  </div>
</div>

</body>
</html>
